# WebNesting gitleaks config — pre-commit secret gate (free-path prevention).
# The built-in ruleset, unmodified. There is deliberately NO allowlist:
#   - no value stopwords — they would allowlist real secrets that merely contain the substring;
#   - no line-target regex for Laravel env()/config() references — the built-in rules do not
#     fire on those (verified 2026-09-20 on gitleaks 8.30.1 over sandbox/config + system/config:
#     "no leaks found"), and a `regexTarget = "line"` allowlist exempts the WHOLE line, so a real
#     key on the same line as an env() reference was skipped (Copilot, claude-automation#1).
# A genuine false positive gets a NARROW per-rule allowlist here, written against the finding's
# match text (`regexTarget = "match"`) and proven with a sample — never a whole-line exemption.
title = "WebNesting"

[extend]
useDefault = true
